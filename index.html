<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Những ngày cũ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main>

  <!-- =========================
       PASSWORD SCREEN
  ========================== -->

  <section class="gate" id="gate">

  <div class="gate-inner">

    <p class="gate-name">Những ngày cũ</p>

    <h1>ma petite vie</h1>

    <p class="gate-question">
      Bạn có phải bạn tôi không đó?<br>
      Tên đầy đủ của tôi là gì?
    </p>

    <form id="login">

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Mật khẩu"
        aria-label="Mật khẩu"
        required
      >

      <button type="submit" aria-label="Vào blog">
        →
      </button>

    </form>

    <p class="error" id="error" hidden>
      Mật khẩu không đúng.
    </p>

  </div>

</section>


  <!-- =========================
       BLOG
  ========================== -->

  <section id="blog" hidden>

    <!-- HOME -->

    <div id="home">

      <header class="hero">

        <img src="hero.jpg" alt="">

        <div class="hero-overlay">

          <h1>ma petite vie</h1>

          <p>
            Hễ duỗi chân ra là kiểu gì cũng đạp phải mông một nhà thơ.
          </p>

        </div>

      </header>


      <section class="home-content">

        <div class="section-heading">
          <span>tản mạn</span>
        </div>

        <div class="post-list" id="post-list"></div>

      </section>

    </div>


    <!-- ARTICLE -->

    <div id="article" hidden>

      <article class="single-post" id="single-post"></article>

    </div>


    <footer>
      © Những ngày cũ
    </footer>

  </section>

</main>


<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
