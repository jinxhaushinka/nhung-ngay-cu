<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Những ngày cũ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">NHỮNG NGÀY CŨ</p>
      <h1>Một góc nhỏ để nhớ.</h1>
      <p class="intro">Những mẩu chuyện, suy nghĩ và những điều mình muốn giữ lại.</p>
    </header>

    <section class="gate" id="gate">
      <p class="lock">✦</p>
      <h2>Private little corner</h2>
      <p>Nhập mật khẩu để đọc.</p>
      <form id="login">
        <input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required>
        <button>Enter</button>
      </form>
      <p class="error" id="error" hidden>Mật khẩu không đúng.</p>
    </section>

    <section id="content" hidden>
      <div class="post-list" id="post-list"></div>
    </section>

    <footer>© Những ngày cũ</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
