<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viết bài — Những ngày cũ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f5f1;
      color: #292929;
      font-family: Arial, sans-serif;
    }

    .editor-wrap {
      max-width: 900px;
      margin: 50px auto;
      padding: 0 24px 80px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 38px;
      margin-bottom: 35px;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #d8d4cc;
      border-radius: 8px;
      padding: 13px 15px;
      font-size: 16px;
      background: white;
      font-family: inherit;
    }

    #title {
      font-family: Georgia, serif;
      font-size: 25px;
    }

    .toolbar {
      display: flex;
      gap: 6px;
      padding: 10px;
      margin-top: 8px;
      background: white;
      border: 1px solid #d8d4cc;
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
    }

    .toolbar button {
      min-width: 38px;
      height: 34px;
      border: 1px solid #ddd;
      background: #fafafa;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    .toolbar button:hover {
      background: #eee;
    }

    #content {
      min-height: 400px;
      border: 1px solid #d8d4cc;
      border-radius: 0 0 8px 8px;
      padding: 20px;
      background: white;
      font-family: Georgia, serif;
      font-size: 18px;
      line-height: 1.8;
      outline: none;
    }

    #content:empty:before {
      content: "Viết gì đó...";
      color: #aaa;
    }

    .image-upload {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border: 1px dashed #bbb;
      border-radius: 8px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    .actions button {
      padding: 13px 22px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
    }

    #previewBtn {
      background: #e8e5df;
    }

    #exportBtn {
      background: #292929;
      color: white;
    }

    #output {
      display: none;
      margin-top: 30px;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
    }

    #output textarea {
      min-height: 250px;
      font-family: monospace;
      font-size: 13px;
    }

    .hint {
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="editor-wrap">

  <h1>Viết một ngày cũ</h1>

  <label for="title">Tiêu đề</label>
  <input id="title" type="text" placeholder="Tên bài viết...">

  <label for="date">Ngày</label>
  <input id="date" type="date">

  <label>Nội dung</label>

  <div class="toolbar">
    <button onclick="formatText('bold')" title="In đậm">
      <b>B</b>
    </button>

    <button onclick="formatText('italic')" title="In nghiêng">
      <i>I</i>
    </button>

    <button onclick="formatText('underline')" title="Gạch chân">
      <u>U</u>
    </button>

    <button onclick="formatText('insertUnorderedList')" title="Danh sách">
      •
    </button>

    <button onclick="formatText('formatBlock', 'blockquote')" title="Trích dẫn">
      “
    </button>
  </div>

  <div id="content" contenteditable="true"></div>

  <div class="image-upload">
    <strong>🖼️ Thêm ảnh</strong>
    <p class="hint">
      Chọn ảnh từ máy tính. Ảnh sẽ được chèn vào vị trí con trỏ trong bài viết.
    </p>

    <input id="imageInput" type="file" accept="image/*">
  </div>

  <div class="actions">
    <button id="previewBtn" onclick="previewPost()">
      Xem trước
    </button>

    <button id="exportBtn" onclick="exportPost()">
      Xuất bài viết
    </button>
  </div>

  <div id="output">
    <h3>Dữ liệu bài viết</h3>

    <p class="hint">
      Copy phần bên dưới để thêm bài viết vào hệ thống.
    </p>

    <textarea id="jsonOutput"></textarea>
  </div>

</div>

<script>

function formatText(command, value = null) {
  document.execCommand(command, false, value);
  document.getElementById("content").focus();
}


/* =========================
   CHÈN ẢNH
========================= */

document.getElementById("imageInput").addEventListener("change", function () {

  const file = this.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function (event) {

    const img = document.createElement("img");

    img.src = event.target.result;

    img.style.maxWidth = "100%";
    img.style.height = "auto";
    img.style.display = "block";
    img.style.margin = "25px auto";

    const selection = window.getSelection();

    if (selection.rangeCount) {

      const range = selection.getRangeAt(0);

      range.deleteContents();
      range.insertNode(img);

      range.setStartAfter(img);
      range.collapse(true);

      selection.removeAllRanges();
      selection.addRange(range);

    } else {

      document.getElementById("content").appendChild(img);

    }

  };

  reader.readAsDataURL(file);

});


/* =========================
   XEM TRƯỚC
========================= */

function previewPost() {

  const title = document.getElementById("title").value;
  const content = document.getElementById("content").innerHTML;

  const preview = window.open("", "_blank");

  preview.document.write(`
    <!doctype html>
    <html lang="vi">
    <head>
      <meta charset="utf-8">
      <title>${escapeHtml(title)}</title>

      <style>
        body {
          max-width: 760px;
          margin: 70px auto;
          padding: 0 25px;
          color: #292929;
          font-family: Georgia, serif;
          line-height: 1.8;
          font-size: 18px;
        }

        h1 {
          font-size: 42px;
          line-height: 1.2;
        }

        img {
          max-width: 100%;
          height: auto;
          display: block;
          margin: 30px auto;
        }
      </style>

    </head>

    <body>

      <h1>${escapeHtml(title)}</h1>

      <div>
        ${content}
      </div>

    </body>
    </html>
  `);

  preview.document.close();
}


/* =========================
   XUẤT BÀI
========================= */

function exportPost() {

  const title = document.getElementById("title").value.trim();
  const date = document.getElementById("date").value;
  const content = document.getElementById("content").innerHTML.trim();

  if (!title) {
    alert("Bạn chưa nhập tiêu đề.");
    return;
  }

  if (!content) {
    alert("Bạn chưa viết nội dung.");
    return;
  }

  const post = {
    id: Date.now().toString(),
    title: title,
    date: date || new Date().toISOString().slice(0, 10),
    content: content
  };

  document.getElementById("output").style.display = "block";

  document.getElementById("jsonOutput").value =
    JSON.stringify(post, null, 2);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
